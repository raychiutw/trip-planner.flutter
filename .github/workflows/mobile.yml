name: Mobile CI / Releases

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_target:
        description: Mobile release destination
        required: true
        default: both
        type: choice
        options:
          - testflight
          - android-internal
          - both
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'
  IOS_BUNDLE_ID: com.raychiu.tripline

jobs:
  ci:
    name: Analyze and test
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          shellcheck: true
          pyflakes: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        # 排除 Patrol 產生的 bundle：它由 `patrol build` 重新產生，格式不受我們
        # 控制，留在檢查範圍內會讓每一支 PR 的 CI 都紅（與改動內容無關）。
        run: >-
          dart format --output=none --set-exit-if-changed
          $(git ls-files '*.dart' ':!:patrol_test/test_bundle.dart')

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run smoke test suite
        run: |
          flutter test \
            test/app/app_smoke_test.dart \
            test/workflows/mobile_e2e_workflow_test.dart
          flutter test test/flows/app_owned_release_flow_test.dart

  testflight:
    name: Upload to TestFlight
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && (inputs.release_target == 'testflight' || inputs.release_target == 'both') }}
    runs-on: macos-26
    environment: mobile-release
    timeout-minutes: 75
    concurrency:
      group: testflight-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Write iOS build secrets
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
        run: |
          set -euo pipefail
          : "${GOOGLE_MAPS_IOS_API_KEY:?Missing GOOGLE_MAPS_IOS_API_KEY secret}"
          umask 077
          printf 'GOOGLE_MAPS_IOS_API_KEY=%s\n' "$GOOGLE_MAPS_IOS_API_KEY" > ios/Flutter/Secrets.xcconfig

      - name: Import Apple Distribution certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@c62019de00bb4395ed414e4a17c98f4e279636de # v6.0.0
        with:
          bundle-id: ${{ env.IOS_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Build IPA
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_ATTEMPT >= 100 )); then
            echo "GITHUB_RUN_ATTEMPT must be below 100; start a new workflow run" >&2
            exit 1
          fi
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          xcodebuild -version
          flutter build ipa \
            --release \
            --build-number="$build_number" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Resolve IPA path
        id: ipa
        run: |
          set -euo pipefail
          ipa_files=(build/ios/ipa/*.ipa)
          if [[ ! -e "${ipa_files[0]}" || "${#ipa_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one IPA in build/ios/ipa" >&2
            exit 1
          fi
          printf 'path=%s\n' "${ipa_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to TestFlight
        uses: Apple-Actions/upload-testflight-build@1ad58030672057aa084b4e96beb6f7a8c627f9e6 # v5.2.1
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'true'

  android_internal:
    name: Upload to Google Play internal testing
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && (inputs.release_target == 'android-internal' || inputs.release_target == 'both') }}
    runs-on: ubuntu-24.04
    environment: mobile-release
    timeout-minutes: 45
    concurrency:
      group: android-internal-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Validate Android release secrets and decode upload key
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          : "${GOOGLE_MAPS_ANDROID_API_KEY:?Missing GOOGLE_MAPS_ANDROID_API_KEY secret}"
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Build signed Android App Bundle
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_ATTEMPT >= 100 )); then
            echo "GITHUB_RUN_ATTEMPT must be below 100; start a new workflow run" >&2
            exit 1
          fi
          version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if (( version_code > 2100000000 )); then
            echo "Android version code exceeds the Google Play limit" >&2
            exit 1
          fi
          flutter build appbundle \
            --release \
            --build-number="$version_code"
          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Upload AAB to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.raychiu.tripline
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
