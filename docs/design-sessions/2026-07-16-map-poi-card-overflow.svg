<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <!-- 地圖底紋：讓「玻璃糊在地圖上」讀得出來 -->
    <pattern id="mapTexture" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#E8EDE6"/>
      <path d="M0 26 H40 M26 0 V40" stroke="#D6DED3" stroke-width="1.5" fill="none"/>
      <path d="M0 10 H40" stroke="#DFE6DC" stroke-width="1" fill="none"/>
    </pattern>
    <pattern id="mapTextureBlur" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#EEF1EC"/>
      <path d="M0 26 H40 M26 0 V40" stroke="#E4E9E2" stroke-width="2.5" fill="none"/>
    </pattern>
    <!-- 被遮蔽區的紅色斜線 -->
    <pattern id="hazard" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#C13515" fill-opacity="0.14"/>
      <rect width="3" height="8" fill="#C13515" fill-opacity="0.42"/>
    </pattern>
    <clipPath id="phoneL"><rect x="90" y="120" width="320" height="600" rx="30"/></clipPath>
    <clipPath id="phoneR"><rect x="550" y="120" width="320" height="600" rx="30"/></clipPath>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C13515"/>
    </marker>
    <marker id="arrowOk" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06A77D"/>
    </marker>
  </defs>

  <rect width="960" height="760" fill="#FFFBF5"/>

  <!-- 標題 -->
  <text x="48" y="52" font-size="23" font-weight="700" fill="#2A1F18">行程地圖 — POI 卡片破版修正</text>
  <text x="48" y="78" font-size="14" fill="#6F5A47">色值取自 tokens.dart；遮蔽高度取自 widget test 實測（Actual 788.0 vs tab bar top 700.0）</text>

  <!-- ============ 修正前 ============ -->
  <text x="90" y="108" font-size="15" font-weight="700" fill="#C13515">修正前 · Column 版型</text>

  <g clip-path="url(#phoneL)">
    <rect x="90" y="120" width="320" height="600" fill="#FFFBF5"/>

    <!-- AppBar -->
    <rect x="90" y="120" width="320" height="44" fill="#FFFBF5"/>
    <path d="M90 164 H410" stroke="#EADFCF" stroke-width="1"/>
    <path d="M112 136 l-7 6 l7 6" stroke="#2A1F18" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="148" font-size="14" font-weight="700" fill="#2A1F18">沖繩家族旅行</text>
    <path d="M380 138 h12 m-4 -4 l4 4 l-4 4 M392 148 h-12 m4 -4 l-4 4 l4 4" stroke="#2A1F18" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- day tabs：不透明長條，吃掉地圖高度 -->
    <rect x="90" y="164" width="320" height="44" fill="#FFFBF5"/>
    <rect x="106" y="172" width="54" height="28" rx="14" fill="#A97A4A"/>
    <text x="133" y="191" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">總覽</text>
    <rect x="168" y="172" width="72" height="28" rx="14" fill="none" stroke="#EADFCF"/>
    <circle cx="184" cy="186" r="4" fill="#EF4444"/>
    <text x="208" y="191" font-size="11" font-weight="600" fill="#2A1F18" text-anchor="middle">DAY 01</text>
    <rect x="248" y="172" width="72" height="28" rx="14" fill="none" stroke="#EADFCF"/>
    <circle cx="264" cy="186" r="4" fill="#F97316"/>
    <text x="288" y="191" font-size="11" font-weight="600" fill="#2A1F18" text-anchor="middle">DAY 02</text>
    <rect x="328" y="172" width="72" height="28" rx="14" fill="none" stroke="#EADFCF"/>
    <circle cx="344" cy="186" r="4" fill="#F59E0B"/>
    <text x="368" y="191" font-size="11" font-weight="600" fill="#2A1F18" text-anchor="middle">DAY 03</text>

    <!-- 地圖：被上下夾住，只剩中間 -->
    <rect x="90" y="208" width="320" height="368" fill="url(#mapTexture)"/>
    <circle cx="200" cy="300" r="13" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="200" y="305" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="290" cy="400" r="13" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="290" y="405" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <path d="M200 300 Q245 330 290 400" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="378" cy="230" r="16" fill="#FFFFFF" stroke="#EADFCF"/>
    <path d="M378 222 v16 M370 230 h16" stroke="#A97A4A" stroke-width="1.8" stroke-linecap="round"/>

    <!-- POI 卡片：貼底 -->
    <rect x="90" y="576" width="320" height="144" fill="#FFFBF5"/>
    <rect x="102" y="588" width="140" height="66" rx="8" fill="#FAF4EA" stroke="#EADFCF"/>
    <circle cx="116" cy="608" r="4" fill="#EF4444"/>
    <text x="128" y="612" font-size="10" font-weight="600" fill="#6F5A47">09:00</text>
    <text x="114" y="634" font-size="13" font-weight="700" fill="#2A1F18">首里城</text>
    <rect x="250" y="588" width="140" height="66" rx="8" fill="#FAF4EA" stroke="#EADFCF"/>
    <circle cx="264" cy="608" r="4" fill="#EF4444"/>
    <text x="276" y="612" font-size="10" font-weight="600" fill="#6F5A47">11:30</text>
    <text x="262" y="634" font-size="13" font-weight="700" fill="#2A1F18">國際通</text>

    <!-- 被遮蔽帶 -->
    <rect x="90" y="640" width="320" height="80" fill="url(#hazard)"/>

    <!-- 玻璃 tab bar 蓋在卡片上 -->
    <rect x="102" y="646" width="296" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFFFFF"/>
    <g fill="#6F5A47" font-size="9" font-weight="500" text-anchor="middle">
      <circle cx="161" cy="662" r="6" fill="none" stroke="#6F5A47" stroke-width="1.5"/>
      <text x="161" y="682">聊天</text>
      <circle cx="220" cy="662" r="6" fill="none" stroke="#A97A4A" stroke-width="1.5"/>
      <text x="220" y="682" fill="#A97A4A" font-weight="700">行程</text>
      <circle cx="279" cy="662" r="6" fill="none" stroke="#6F5A47" stroke-width="1.5"/>
      <text x="279" y="682">地圖</text>
      <circle cx="338" cy="662" r="6" fill="none" stroke="#6F5A47" stroke-width="1.5"/>
      <text x="338" y="682">收藏</text>
    </g>
    <rect x="176" y="708" width="148" height="4" rx="2" fill="#2A1F18" fill-opacity="0.25"/>
  </g>
  <rect x="90" y="120" width="320" height="600" rx="30" fill="none" stroke="#2A1F18" stroke-width="2"/>

  <!-- 修正前標註 -->
  <path d="M470 680 H418" stroke="#C13515" stroke-width="1.8" marker-end="url(#arrow)" fill="none"/>
  <text x="476" y="668" font-size="12" font-weight="700" fill="#C13515">88px 卡片被蓋住</text>
  <text x="476" y="686" font-size="11" fill="#6F5A47">整張卡的標題與時間</text>
  <text x="476" y="702" font-size="11" fill="#6F5A47">都點不到、看不到</text>

  <path d="M470 186 H418" stroke="#C13515" stroke-width="1.8" marker-end="url(#arrow)" fill="none"/>
  <text x="440" y="176" font-size="11" font-weight="600" fill="#C13515" text-anchor="end">day tabs</text>
  <text x="440" y="192" font-size="11" font-weight="600" fill="#C13515" text-anchor="end">吃掉地圖高度</text>

  <!-- ============ 修正後 ============ -->
  <text x="550" y="108" font-size="15" font-weight="700" fill="#06A77D">修正後 · Stack 浮層</text>

  <g clip-path="url(#phoneR)">
    <rect x="550" y="120" width="320" height="600" fill="#FFFBF5"/>

    <!-- AppBar -->
    <rect x="550" y="120" width="320" height="44" fill="#FFFBF5"/>
    <path d="M550 164 H870" stroke="#EADFCF" stroke-width="1"/>
    <path d="M572 136 l-7 6 l7 6" stroke="#2A1F18" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="588" y="148" font-size="14" font-weight="700" fill="#2A1F18">沖繩家族旅行</text>
    <path d="M840 138 h12 m-4 -4 l4 4 l-4 4 M852 148 h-12 m4 -4 l-4 4 l4 4" stroke="#2A1F18" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 地圖：滿版，一路延伸到底 -->
    <rect x="550" y="164" width="320" height="556" fill="url(#mapTexture)"/>
    <circle cx="640" cy="300" r="13" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="640" y="305" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="760" cy="420" r="13" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="760" y="425" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="690" cy="520" r="13" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="690" y="525" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <path d="M640 300 Q710 350 760 420 Q725 480 690 520" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- day tabs：浮在地圖上，實底 pill -->
    <rect x="566" y="172" width="54" height="28" rx="14" fill="#A97A4A"/>
    <text x="593" y="191" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">總覽</text>
    <rect x="628" y="172" width="72" height="28" rx="14" fill="#FFFBF5" stroke="#EADFCF"/>
    <circle cx="644" cy="186" r="4" fill="#EF4444"/>
    <text x="668" y="191" font-size="11" font-weight="600" fill="#2A1F18" text-anchor="middle">DAY 01</text>
    <rect x="708" y="172" width="72" height="28" rx="14" fill="#FFFBF5" stroke="#EADFCF"/>
    <circle cx="724" cy="186" r="4" fill="#F97316"/>
    <text x="748" y="191" font-size="11" font-weight="600" fill="#2A1F18" text-anchor="middle">DAY 02</text>
    <rect x="788" y="172" width="72" height="28" rx="14" fill="#FFFBF5" stroke="#EADFCF"/>
    <circle cx="804" cy="186" r="4" fill="#F59E0B"/>
    <text x="828" y="191" font-size="11" font-weight="600" fill="#2A1F18" text-anchor="middle">DAY 03</text>

    <!-- 定位鈕：移到 day tabs 下方，不再撞位 -->
    <circle cx="838" cy="230" r="16" fill="#FFFFFF" stroke="#EADFCF"/>
    <path d="M838 222 v16 M830 230 h16" stroke="#A97A4A" stroke-width="1.8" stroke-linecap="round"/>

    <!-- POI 卡：浮在 tab bar 上方 -->
    <rect x="562" y="560" width="140" height="66" rx="8" fill="#FAF4EA" stroke="#EADFCF"/>
    <circle cx="576" cy="580" r="4" fill="#EF4444"/>
    <text x="588" y="584" font-size="10" font-weight="600" fill="#6F5A47">09:00</text>
    <text x="574" y="606" font-size="13" font-weight="700" fill="#2A1F18">首里城</text>
    <rect x="710" y="560" width="140" height="66" rx="8" fill="#FAF4EA" stroke="#EADFCF"/>
    <circle cx="724" cy="580" r="4" fill="#EF4444"/>
    <text x="736" y="584" font-size="10" font-weight="600" fill="#6F5A47">11:30</text>
    <text x="722" y="606" font-size="13" font-weight="700" fill="#2A1F18">國際通</text>

    <!-- 玻璃 tab bar：底下是真的地圖（模糊底紋） -->
    <rect x="562" y="646" width="296" height="46" rx="23" fill="url(#mapTextureBlur)"/>
    <rect x="562" y="646" width="296" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.68" stroke="#FFFFFF"/>
    <g fill="#6F5A47" font-size="9" font-weight="500" text-anchor="middle">
      <circle cx="621" cy="662" r="6" fill="none" stroke="#6F5A47" stroke-width="1.5"/>
      <text x="621" y="682">聊天</text>
      <circle cx="680" cy="662" r="6" fill="none" stroke="#A97A4A" stroke-width="1.5"/>
      <text x="680" y="682" fill="#A97A4A" font-weight="700">行程</text>
      <circle cx="739" cy="662" r="6" fill="none" stroke="#6F5A47" stroke-width="1.5"/>
      <text x="739" y="682">地圖</text>
      <circle cx="798" cy="662" r="6" fill="none" stroke="#6F5A47" stroke-width="1.5"/>
      <text x="798" y="682">收藏</text>
    </g>
    <rect x="636" y="708" width="148" height="4" rx="2" fill="#2A1F18" fill-opacity="0.25"/>
  </g>
  <rect x="550" y="120" width="320" height="600" rx="30" fill="none" stroke="#2A1F18" stroke-width="2"/>

  <!-- 修正後標註 -->
  <path d="M500 592 H556" stroke="#06A77D" stroke-width="1.8" marker-end="url(#arrowOk)" fill="none"/>
  <text x="494" y="580" font-size="12" font-weight="700" fill="#06A77D" text-anchor="end">POI 卡完整露出</text>
  <text x="494" y="598" font-size="11" fill="#6F5A47" text-anchor="end">吃掉 padding.bottom</text>

  <path d="M500 668 H556" stroke="#06A77D" stroke-width="1.8" marker-end="url(#arrowOk)" fill="none"/>
  <text x="494" y="662" font-size="11" font-weight="600" fill="#06A77D" text-anchor="end">玻璃底下是地圖</text>
  <text x="494" y="678" font-size="11" fill="#6F5A47" text-anchor="end">而非死色塊</text>

  <path d="M910 300 H872" stroke="#06A77D" stroke-width="1.8" marker-end="url(#arrowOk)" fill="none"/>
  <text x="916" y="292" font-size="11" font-weight="600" fill="#06A77D">地圖</text>
  <text x="916" y="308" font-size="11" font-weight="600" fill="#06A77D">滿版</text>

  <!-- 底部說明 -->
  <text x="48" y="748" font-size="11" fill="#6F5A47">Stack 取代 Column：地圖 Positioned.fill 滿版延伸到玻璃底下；day tabs 與 POI 卡改為浮層（對應 Apple tabViewBottomAccessory 語意）；fit padding 同步避開浮層，pin 不再被塞在卡片下。</text>
</svg>
